<!doctype html>
<html>
  <head>
  </head>
  <body
    style="
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    "
  >
    <table
      align="center"
      border="0"
      cellpadding="0"
      cellspacing="0"
      width="600"
      style="
        border-collapse: collapse;
        background-color: #ffffff;
        margin-top: 20px;
      "
    >
      <tr>
        <td
          align="center"
          bgcolor="#ffffff"
          style="padding: 20px 30px 20px 30px"
        >
          <h2 style="margin: 0">{{title}}</h2>
        </td>
      </tr>
      <tr>
        <td align="left" style="padding: 20px 30px 40px 30px">
          <p style="margin: 0">{{body_line_1}}</p>
          <p style="margin: 20px 0 0 0">{{body_line_2}}</p>
          <p style="margin: 20px 0 0 0; font-size: 24px; font-weight: bold">
            {{otp}}
          </p>
          <p style="margin: 20px 0 0 0">{{body_line_3}}</p>
          <p style="margin: 20px 0 0 0">{{body_line_4}}</p>
          <p style="margin: 40px 0 0 0">
            {{best_regards}},<br />
            {{management_team}}
          </p>
        </td>
      </tr>
      <tr>
        <td
          align="center"
          bgcolor="#f4f4f4"
          style="padding: 30px 30px 30px 30px"
        >
          <p style="margin: 0; color: #888888; font-size: 12px">
            &copy; 2024 Employee Management. All rights reserved.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
